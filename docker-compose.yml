services:
  corevault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corevault-enterprise
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/corevault.db
      - PORT=3000
      # Resend Email Configuration (OTP & Team Invitations)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-no-reply@jioratech.com}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-CoreVault Security}
      # S3-Compatible Cloud Bucket Configuration
      - S3_URL=${S3_URL:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-${S3_URL:-}}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY:-}}
      - S3_SECRET-KEY=${S3_SECRET-KEY:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${S3_SECRET-KEY:-}}
      - BUCKET_NAME=${BUCKET_NAME:-expanse}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-${BUCKET_NAME:-expanse}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=true
    volumes:
      # Named persistent volume: Survives all Dokploy redeployments and git pulls
      - corevault_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/auth', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  corevault_data:
    driver: local
