services:
  expensetracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expensetracker-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=3000
      # S3-Compatible Bucket Configuration (referenced from .env)
      - S3_URL=${S3_URL:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-${S3_URL:-}}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY:-}}
      - S3_SECRET-KEY=${S3_SECRET-KEY:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-${S3_SECRET-KEY:-}}
      - BUCKET_NAME=${BUCKET_NAME:-expanse}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-${BUCKET_NAME:-expanse}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=true
    volumes:
      # Persistent local storage for SQLite database and uploaded documents
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/auth', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
